schema_version: 1

package:
  name: data_validation_engine
  version: 0.10.1

source:
  url: https://files.pythonhosted.org/packages/source/d/data-validation-engine/data_validation_engine-0.10.1.tar.gz
  sha256: 1156d76ead8faf48ed6a080576e7b38d0a371270842f805b48469ac1fbf61886

requirements:
  host:
    - python >=3.11,<3.13
    - poetry-core
    - pip

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv

  run:
    - python >=3.11,<3.13
    - boto3 >=1.34.162,<1.36
    - botocore >=1.34.162,<1.36
    - delta-spark >=3.0.0,<=3.2.0
    - python-duckdb >=1.4,<1.4.5
    - jinja2 3.1.6.*
    - lxml 6.1.1.*
    - numpy 1.26.4.*
    - openpyxl 3.1.5.*
    - pandas 2.3.3.*
    - polars 0.20.31.*
    - pyarrow 23.0.1.*
    - pydantic 2.13.4.*
    - pyspark >=3.5.0,<=3.5.5
    - typing_extensions 4.16.0.*
    - urllib3 2.8.0.*

tests:
  - python:
      imports:
        - data_validation_engine
      pip_check: true

about:
  summary: "`nhs data validation engine` is a framework used to validate data"
  license: "MIT"
  license_file: "LICENSE"
  homepage: "https://github.com/NHSDigital/data-validation-engine"
  documentation: "https://nhsdigital.github.io/data-validation-engine/"

extra:
  recipe-maintainers:
    - georgeRobertson
    - stevenhsd
